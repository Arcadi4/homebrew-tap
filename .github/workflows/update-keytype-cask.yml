name: Update keytype cask

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7,22 * * *"

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Fetch latest release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: johnbean393/KeyType
        run: |
          set -euo pipefail

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPO}/releases" > releases.json

          release_json="$(
            jq -cer '
              map(
                select(.draft == false)
                | select((.assets // []) | map(.name | test("^KeyType\\.[0-9]+(?:\\.[0-9]+)*\\.dmg$")) | any)
              )
              | first
            ' releases.json
          )"

          if [ -z "$release_json" ] || [ "$release_json" = "null" ]; then
            echo "No eligible release with a KeyType DMG asset found." >&2
            exit 1
          fi

          tag="$(jq -r '.tag_name' <<<"$release_json")"
          version="${tag#v}"

          asset_json="$(
            jq -cer '
              .assets
              | map(select(.name | test("^KeyType\\.[0-9]+(?:\\.[0-9]+)*\\.dmg$")))
              | first
            ' <<<"$release_json"
          )"

          if [ -z "$asset_json" ] || [ "$asset_json" = "null" ]; then
            echo "No KeyType DMG asset found in selected release." >&2
            exit 1
          fi

          digest="$(jq -r '.digest // empty' <<<"$asset_json")"

          if [ -z "$digest" ]; then
            echo "Release asset digest is missing for KeyType DMG." >&2
            exit 1
          fi

          if [[ "$digest" != sha256:* ]]; then
            echo "Unexpected digest format for KeyType DMG: $digest" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha256=${digest#sha256:}"
          } >> "$GITHUB_OUTPUT"

      - name: Update cask file
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          CASK_FILE: Casks/keytype.rb
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          file = ENV.fetch("CASK_FILE")
          version = ENV.fetch("VERSION")
          sha256 = ENV.fetch("SHA256")

          text = File.read(file)

          def replace!(text, pattern, replacement, description)
            text.sub!(pattern, replacement) || abort("Could not update #{description} in cask file.")
          end

          replace!(
            text,
            /^\s*version\s+"[^"]+"$/,
            %(  version "#{version}"),
            "version"
          )

          replace!(
            text,
            /^\s*sha256\s+"[0-9a-f]{64}"$/,
            %(  sha256 "#{sha256}"),
            "checksum"
          )

          File.write(file, text)
          RUBY

      - name: Audit cask
        run: |
          brew audit --cask --online arcadi4/tap/keytype

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/keytype.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff -- Casks/keytype.rb
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/keytype.rb
          git commit -m "Bump keytype to ${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
