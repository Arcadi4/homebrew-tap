name: Update litematicaql cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific LitematicaQL version to publish (leave blank for latest)"
        required: false
        type: string

permissions:
  contents: write

env:
  # The cask and Sparkle both download from this mirror. The archives keep the
  # names produced by `just release`, e.g. LitematicaQL-1.5.1-arm64.zip.
  PACKAGE_BASE_URL: https://download.arcadia.moe/litematicaql

jobs:
  update-cask:
    runs-on: macos-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Fetch latest release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: Arcadi4/LitematicaQL
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_VERSION}" ]; then
            tag_to_fetch="v${REQUESTED_VERSION#v}"
            release_json="$(gh api "repos/${REPO}/releases/tags/${tag_to_fetch}")"
          else
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPO}/releases" > releases.json

            release_json="$(
              jq -cer '
                map(
                  select(.draft == false and .prerelease == false)
                  | .tag_name as $tag
                  | select(
                      any(.assets[]?; .name == "LitematicaQL-\($tag | ltrimstr("v"))-arm64.zip") and
                      any(.assets[]?; .name == "LitematicaQL-\($tag | ltrimstr("v"))-x86_64.zip")
                    )
                )
                | first // empty
              ' releases.json
            )"
          fi

          if [ -z "$release_json" ] || [ "$release_json" = "null" ]; then
            echo "No eligible release with arm64 and x86_64 assets found." >&2
            exit 1
          fi

          tag="$(jq -r '.tag_name' <<<"$release_json")"
          version="${tag#v}"

          # GitHub releases remain the source of truth for which version exists
          # and which assets it carries; the packages themselves are downloaded
          # from the Cloudflare mirror below.
          printf '%s' "$release_json" > "${RUNNER_TEMP}/litematicaql-release.json"

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Checksum Cloudflare packages
        id: packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          release_json="$(cat "${RUNNER_TEMP}/litematicaql-release.json")"
          arm_asset="LitematicaQL-${VERSION}-arm64.zip"
          intel_asset="LitematicaQL-${VERSION}-x86_64.zip"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          # The release decides which archives exist; reject a version whose
          # assets are missing instead of waiting on the mirror for them.
          for asset_name in "$arm_asset" "$intel_asset"; do
            if ! jq -e --arg name "$asset_name" 'any(.assets[]?; .name == $name)' <<<"$release_json" >/dev/null; then
              echo "Release ${VERSION} has no asset named ${asset_name}." >&2
              jq -r '.assets[].name' <<<"$release_json" >&2
              exit 1
            fi
          done

          download_package() {
            local asset_name="$1"
            local target="$2"
            local url="${PACKAGE_BASE_URL}/${asset_name}"
            local attempt=1
            local max_attempts=10
            local status

            # A freshly published release may reach the mirror a few minutes
            # after the GitHub asset, so retry until the mirror answers.
            while true; do
              status="$(curl -sSL --retry 3 --retry-delay 5 -o "$target" -w '%{http_code}' "$url" || true)"
              if [ "$status" = "200" ]; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Cloudflare mirror did not serve ${url} after ${max_attempts} attempts (last HTTP status: ${status:-none})." >&2
                return 1
              fi
              echo "Waiting for ${url} (HTTP ${status:-none}, attempt ${attempt}/${max_attempts})..." >&2
              sleep 30
              attempt=$((attempt + 1))
            done
          }

          validate_package() {
            local asset_name="$1"
            local path="$2"
            local size

            if [ "$(head -c 2 "$path")" != "PK" ]; then
              echo "${asset_name} from the mirror is not a zip archive." >&2
              return 1
            fi

            size="$(wc -c < "$path" | tr -d ' ')"
            if [ "$size" -lt 102400 ]; then
              echo "Mirror copy of ${asset_name} is only ${size} bytes; refusing to trust it." >&2
              return 1
            fi
          }

          # The cask checksum must describe the bytes Homebrew actually
          # downloads, so the mirror download is hashed. The GitHub digest is
          # only used to prove the mirror is serving the release asset unchanged.
          verify_against_release() {
            local asset_name="$1"
            local sha256="$2"
            local digest

            digest="$(jq -r --arg name "$asset_name" '[.assets[] | select(.name == $name) | .digest // empty] | first // empty' <<<"$release_json")"
            if [ -z "$digest" ]; then
              echo "Release does not report a digest for ${asset_name}; refusing to trust the mirror." >&2
              return 1
            fi
            if [ "$digest" != "sha256:${sha256}" ]; then
              echo "Mirror copy of ${asset_name} (sha256:${sha256}) does not match the release asset (${digest})." >&2
              echo "Re-upload the release archive to ${PACKAGE_BASE_URL} before updating the cask." >&2
              return 1
            fi
          }

          sha256_of_package() {
            local asset_name="$1"
            local path="${workdir}/${asset_name}"
            local sha256

            # Command substitution runs these in a subshell where `set -e` does
            # not abort, so every failure has to be propagated explicitly.
            download_package "$asset_name" "$path" || return 1
            validate_package "$asset_name" "$path" || return 1
            sha256="$(shasum -a 256 "$path" | cut -d' ' -f1)"
            if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Computed an unusable digest for ${asset_name}: ${sha256}" >&2
              return 1
            fi
            verify_against_release "$asset_name" "$sha256" || return 1
            echo "$sha256"
          }

          arm_sha256="$(sha256_of_package "$arm_asset")" || exit 1
          intel_sha256="$(sha256_of_package "$intel_asset")" || exit 1

          {
            echo "arm_sha256=$arm_sha256"
            echo "intel_sha256=$intel_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Update cask file
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARM_SHA256: ${{ steps.packages.outputs.arm_sha256 }}
          INTEL_SHA256: ${{ steps.packages.outputs.intel_sha256 }}
          CASK_FILE: Casks/litematicaql.rb
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          file = ENV.fetch("CASK_FILE")
          version = ENV.fetch("VERSION")
          arm_sha256 = ENV.fetch("ARM_SHA256")
          intel_sha256 = ENV.fetch("INTEL_SHA256")

          text = File.read(file)

          # The checksums are computed from the mirror, so refuse to write them
          # into a cask that still points somewhere else.
          mirror_template = 'https://download.arcadia.moe/litematicaql/LitematicaQL-#{version}-#{arch}.zip'
          abort("Cask does not download from the Cloudflare mirror; expected #{mirror_template}.") unless text.include?(mirror_template)

          def replace!(text, pattern, replacement, description)
            text.sub!(pattern, replacement) || abort("Could not update #{description} in cask file.")
          end

          replace!(
            text,
            /^[ \t]*version[ \t]+"[^"]+"$/,
            %(  version "#{version}"),
            "version"
          )

          replace!(
            text,
            /^[ \t]*sha256[ \t]+arm:[ \t]+"[0-9a-f]{64}",\n[ \t]*intel:[ \t]+"[0-9a-f]{64}"$/,
            %(  sha256 arm:   "#{arm_sha256}",\n         intel: "#{intel_sha256}"),
            "checksums"
          )

          File.write(file, text)
          RUBY

      - name: Audit cask
        run: |
          brew style --cask arcadi4/tap/litematicaql
          brew audit --cask --online arcadi4/tap/litematicaql

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/litematicaql.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff -- Casks/litematicaql.rb
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/litematicaql.rb
          git commit -m "Bump litematicaql to ${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
