name: Update bililive-cli formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific bililive-cli version to publish (leave blank for latest)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Fetch latest release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: Arcadi4/bililive-cli
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_VERSION}" ]; then
            tag_to_fetch="v${REQUESTED_VERSION#v}"
            release_json="$(gh api "repos/${REPO}/releases/tags/${tag_to_fetch}")"
          else
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPO}/releases" > releases.json

            release_json="$(
              jq -cer '
                map(
                  select(.draft == false and .prerelease == false)
                  | .tag_name as $tag
                  | select(
                      any(.assets[]?; .name == "bililive_\($tag)_darwin_arm64.tar.gz") and
                      any(.assets[]?; .name == "bililive_\($tag)_darwin_amd64.tar.gz") and
                      any(.assets[]?; .name == "bililive_\($tag)_linux_arm64.tar.gz") and
                      any(.assets[]?; .name == "bililive_\($tag)_linux_amd64.tar.gz")
                    )
                )
                | first // empty
              ' releases.json
            )"
          fi

          if [ -z "$release_json" ] || [ "$release_json" = "null" ]; then
            echo "No eligible release with all 4 target assets found." >&2
            exit 1
          fi

          tag="$(jq -r '.tag_name' <<<"$release_json")"
          version="${tag#v}"

          get_digest() {
            local asset_name="$1"
            local asset
            asset="$(jq -cer --arg name "$asset_name" '.assets[] | select(.name == $name)' <<<"$release_json")"
            local digest
            digest="$(jq -r '.digest // empty' <<<"$asset")"
            if [ -z "$digest" ]; then
              local url
              url="$(jq -r '.browser_download_url' <<<"$asset")"
              echo "Release asset digest is missing for ${asset_name}, computing from download..." >&2
              digest="sha256:$(curl -sSL "$url" | shasum -a 256 | cut -d' ' -f1)"
            fi
            if [[ "$digest" != sha256:* ]]; then
              echo "Unexpected digest format for ${asset_name}: ${digest}" >&2
              exit 1
            fi
            echo "${digest#sha256:}"
          }

          macos_arm_sha256="$(get_digest "bililive_${tag}_darwin_arm64.tar.gz")"
          macos_intel_sha256="$(get_digest "bililive_${tag}_darwin_amd64.tar.gz")"
          linux_arm_sha256="$(get_digest "bililive_${tag}_linux_arm64.tar.gz")"
          linux_intel_sha256="$(get_digest "bililive_${tag}_linux_amd64.tar.gz")"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "macos_arm_sha256=$macos_arm_sha256"
            echo "macos_intel_sha256=$macos_intel_sha256"
            echo "linux_arm_sha256=$linux_arm_sha256"
            echo "linux_intel_sha256=$linux_intel_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Update formula file
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MACOS_ARM_SHA256: ${{ steps.release.outputs.macos_arm_sha256 }}
          MACOS_INTEL_SHA256: ${{ steps.release.outputs.macos_intel_sha256 }}
          LINUX_ARM_SHA256: ${{ steps.release.outputs.linux_arm_sha256 }}
          LINUX_INTEL_SHA256: ${{ steps.release.outputs.linux_intel_sha256 }}
          FORMULA_FILE: Formula/bililive-cli.rb
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          file = ENV.fetch("FORMULA_FILE")
          tag = ENV.fetch("TAG")
          macos_arm_sha256 = ENV.fetch("MACOS_ARM_SHA256")
          macos_intel_sha256 = ENV.fetch("MACOS_INTEL_SHA256")
          linux_arm_sha256 = ENV.fetch("LINUX_ARM_SHA256")
          linux_intel_sha256 = ENV.fetch("LINUX_INTEL_SHA256")

          text = File.read(file)

          def update_asset!(text, suffix, new_tag, new_sha256)
            pattern = /(  url ")[^"]*?bililive_[^"]*?#{Regexp.escape(suffix)}("\n[ \t]*sha256 )"[0-9a-f]{64}"/
            url = "https://github.com/Arcadi4/bililive-cli/releases/download/#{new_tag}/bililive_#{new_tag}_#{suffix}"
            text.sub!(pattern, "\\1#{url}\\2\"#{new_sha256}\"") || abort("Could not update the #{suffix} block")
          end

          update_asset!(text, "darwin_arm64.tar.gz", tag, macos_arm_sha256)
          update_asset!(text, "darwin_amd64.tar.gz", tag, macos_intel_sha256)
          update_asset!(text, "linux_arm64.tar.gz", tag, linux_arm_sha256)
          update_asset!(text, "linux_amd64.tar.gz", tag, linux_intel_sha256)

          File.write(file, text)
          RUBY

      - name: Audit formula
        run: |
          brew style --formula arcadi4/tap/bililive-cli
          brew audit --formula --online arcadi4/tap/bililive-cli

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/bililive-cli.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff -- Formula/bililive-cli.rb
          fi

      - name: Install and test formula
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          brew install arcadi4/tap/bililive-cli
          brew test arcadi4/tap/bililive-cli
          brew uninstall bililive-cli

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bililive-cli.rb
          git commit -m "Bump bililive-cli to ${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
