name: Update sidekick-ai cask

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6,23 * * *"

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: macos-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Fetch latest release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: johnbean393/Sidekick
        run: |
          set -euo pipefail

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPO}/releases" > releases.json

          release_json="$(
            jq -cer '
              map(
                select(.draft == false)
                | select((.assets // []) | map(.name | test("\\.dmg$")) | any)
              )
              | first
            ' releases.json
          )"

          if [ -z "$release_json" ] || [ "$release_json" = "null" ]; then
            echo "No eligible release with a .dmg asset found."
            exit 1
          fi

          tag="$(jq -r '.tag_name' <<<"$release_json")"
          version="${tag#v}"

          asset_json="$(
            jq -cer '
              .assets
              | map(select(.name | test("\\.dmg$")))
              | first
            ' <<<"$release_json"
          )"

          if [ -z "$asset_json" ] || [ "$asset_json" = "null" ]; then
            echo "No .dmg asset found in selected release."
            exit 1
          fi

          asset_name="$(jq -r '.name' <<<"$asset_json")"
          browser_url="$(jq -r '.browser_download_url' <<<"$asset_json")"
          digest="$(jq -r '.digest // empty' <<<"$asset_json")"

          if [ -z "$digest" ]; then
            echo "Release asset digest is missing."
            exit 1
          fi

          if [[ "$digest" != sha256:* ]]; then
            echo "Unexpected digest format: $digest"
            exit 1
          fi

          sha256="${digest#sha256:}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "asset_name=$asset_name"
            echo "browser_url=$browser_url"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Update cask file
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          URL: ${{ steps.release.outputs.browser_url }}
          CASK_FILE: Casks/sidekick-ai.rb
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          file = ENV.fetch("CASK_FILE")
          version = ENV.fetch("VERSION")
          sha256 = ENV.fetch("SHA256")
          url = ENV.fetch("URL")

          # Rebuild the URL with #{version} interpolation so Homebrew treats
          # it as a versioned URL (instead of an unversioned one with a pinned
          # sha256, which fails `brew audit`).
          interpolated_url = url.gsub(version, '#{version}')

          text = File.read(file)

          def replace!(text, pattern, replacement, description)
            text.sub!(pattern, replacement) || abort("Could not update #{description} in cask file.")
          end

          replace!(
            text,
            /^[ \t]*version[ \t]+"[^"]+"$/,
            %(  version "#{version}"),
            "version"
          )

          replace!(
            text,
            /^[ \t]*sha256[ \t]+"[^"]+"$/,
            %(  sha256 "#{sha256}"),
            "checksum"
          )

          # Remove deprecated `verified:` parameter if present (handles both
          # comma-terminated url with next-line verified and standalone).
          text.sub!(/,\s*\n\s*verified:\s+"[^"]+"/, "")

          replace!(
            text,
            /^[ \t]*url[ \t]+"[^"]+"$/,
            %(  url "#{interpolated_url}"),
            "url"
          )

          # Ensure style-compliant grouping: exactly one blank line between sha256 and url.
          text.sub!(/(sha256 "[^"]+")\n  url/, "\\1\n\n  url")

          File.write(file, text)
          RUBY

      - name: Audit cask
        run: |
          brew audit --cask --online arcadi4/tap/sidekick-ai

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/sidekick-ai.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff -- Casks/sidekick-ai.rb
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sidekick-ai.rb
          git commit -m "Bump sidekick-ai to ${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
